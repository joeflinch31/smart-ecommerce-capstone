<!DOCTYPE html>
<html>
<head>
    <title>Week 3 - Validation</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; margin: 10px; border-radius: 5px; }
        input { padding: 8px; margin: 5px; width: 200px; }
        button { padding: 8px 15px; background: orange; border: none; cursor: pointer; }
        .error { color: red; display: none; }
        .success { color: green; display: none; }
    </style>
</head>
<body>
    <h1>Week 3: JavaScript Validation</h1>

    <div class="card">
        <h2>Registration Form</h2>
        <form id="regForm">
            <div>
                <label>Full Name:</label><br>
                <input type="text" id="name" placeholder="Enter name">
                <div class="error" id="nameError">Name is required</div>
            </div>
            <div>
                <label>Email:</label><br>
                <input type="email" id="email" placeholder="email@example.com">
                <div class="error" id="emailError">Valid email required</div>
                <div class="success" id="emailSuccess">✓ Good email</div>
            </div>
            <div>
                <label>Password:</label><br>
                <input type="password" id="password" placeholder="Password (min 6 chars)">
                <div class="error" id="pwdError">Password must be at least 6 characters</div>
            </div>
            <div>
                <label>Confirm Password:</label><br>
                <input type="password" id="confirm">
                <div class="error" id="confirmError">Passwords don't match</div>
                <div class="success" id="confirmSuccess">✓ Match</div>
            </div>
            <br>
            <button type="submit">Register</button>
        </form>
        <div id="result" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h2>Live Text Preview</h2>
        <input type="text" id="liveInput" placeholder="Type something...">
        <p id="preview">Your text will appear here</p>
    </div>

    <div class="card">
        <h2>Dynamic Menu</h2>
        <button onclick="showContent('home')">Home</button>
        <button onclick="showContent('products')">Products</button>
        <button onclick="showContent('profile')">Profile</button>
        <div id="menuContent" style="margin-top: 10px; padding: 10px; background: #f0f0f0;">
            Welcome! Click a button.
        </div>
    </div>

    <script>
        // Form validation
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const pwdInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');

        function validateName() {
            const error = document.getElementById('nameError');
            if (nameInput.value === '') {
                error.style.display = 'block';
                return false;
            }
            error.style.display = 'none';
            return true;
        }

        function validateEmail() {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const error = document.getElementById('emailError');
            const success = document.getElementById('emailSuccess');
            if (emailInput.value === '') {
                error.style.display = 'none';
                success.style.display = 'none';
                return false;
            }
            if (!regex.test(emailInput.value)) {
                error.style.display = 'block';
                success.style.display = 'none';
                return false;
            }
            error.style.display = 'none';
            success.style.display = 'block';
            return true;
        }

        function validatePassword() {
            const error = document.getElementById('pwdError');
            if (pwdInput.value.length < 6) {
                error.style.display = 'block';
                return false;
            }
            error.style.display = 'none';
            return true;
        }

        function validateConfirm() {
            const error = document.getElementById('confirmError');
            const success = document.getElementById('confirmSuccess');
            if (confirmInput.value === '') {
                error.style.display = 'none';
                success.style.display = 'none';
                return false;
            }
            if (pwdInput.value !== confirmInput.value) {
                error.style.display = 'block';
                success.style.display = 'none';
                return false;
            }
            error.style.display = 'none';
            success.style.display = 'block';
            return true;
        }

        nameInput.addEventListener('input', validateName);
        emailInput.addEventListener('input', validateEmail);
        pwdInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validateConfirm);

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const valid = validateName() && validateEmail() && validatePassword() && validateConfirm();
            const result = document.getElementById('result');
            if (valid) {
                result.innerHTML = '<span style="color:green">✅ Registration successful!</span>';
            } else {
                result.innerHTML = '<span style="color:red">❌ Please fix errors.</span>';
            }
        });

        // Live preview
        document.getElementById('liveInput').addEventListener('input', function() {
            document.getElementById('preview').innerHTML = this.value || 'Your text will appear here';
        });

        // Dynamic menu
        function showContent(page) {
            const contentDiv = document.getElementById('menuContent');
            if (page === 'home') {
                contentDiv.innerHTML = '<h3>Home Page</h3><p>Welcome to the e-commerce store!</p>';
            } else if (page === 'products') {
                contentDiv.innerHTML = '<h3>Our Products</h3><ul><li>Wireless Mouse - $25.99</li><li>Mechanical Keyboard - $79.99</li><li>USB-C Hub - $45.50</li><li>Laptop Stand - $32.00</li><li>Webcam HD - $49.99</li><li>Gaming Headset - $89.99</li></ul>';
            } else if (page === 'profile') {
                contentDiv.innerHTML = '<h3>User Profile</h3><p>You are not logged in. <a href="login.php">Login here</a></p>';
            }
        }
    </script>
</body>
</html>
